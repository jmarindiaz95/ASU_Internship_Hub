services:
  db:
    build:
      context: .
      dockerfile: docker/postgres.Dockerfile
    environment:
      POSTGRES_DB: internship_hub
      POSTGRES_USER: hub
      POSTGRES_PASSWORD: hub_local
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
  web:
    build: .
    environment:
      DATABASE_URL: postgresql://hub:hub_local@db:5432/internship_hub
      HOST: 0.0.0.0
      PORT: 8080
      INITIALIZE_DATABASE: "1"
      AUTO_REFRESH: "1"
    ports:
      - "127.0.0.1:${HUB_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
volumes:
  postgres_data:
